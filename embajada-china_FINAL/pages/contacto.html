<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto | Embajada China</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/layout.css"><link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body data-root="../" data-nav="contacto">
<div id="site-header"></div>
<nav class="migas contenedor" id="migas" aria-label="Ruta de navegación"></nav>
<main id="main">
<div class="contenedor pagina">
  <div class="pagina__intro"><h1>Contacto</h1><p>Escríbenos y te respondemos.</p></div>
  <div class="contacto">
    <dl class="contacto__datos" id="datos"></dl>
    <form id="form-contacto">
      <div class="campo"><label for="nombre">Nombre</label><input id="nombre" required autocomplete="name"></div>
      <div class="campo"><label for="correo">Correo</label><input id="correo" type="email" required autocomplete="email"></div>
      <div class="campo"><label for="mensaje">Mensaje</label><textarea id="mensaje" required></textarea></div>
      <button class="boton boton--primario" type="submit">Enviar mensaje</button>
      <p class="aviso-envio" id="aviso-envio" role="status" hidden></p>
    </form>
  </div>
</div>
</main>
<div id="site-footer"></div>
<script src="../assets/js/core/util.js"></script><script src="../assets/js/core/almacen.js"></script><script src="../assets/js/data/menu.js"></script><script src="../assets/js/data/reservas.js"></script><script src="../assets/js/components/modal.js"></script><script src="../assets/js/components/carrito.js"></script><script src="../assets/js/components/pedidos.js"></script><script src="../assets/js/components/busqueda.js"></script><script src="../assets/js/core/layout.js"></script><script src="../assets/js/pages/contacto.js"></script>
</body>
</html>
