<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro | Caballero</title><link rel="stylesheet" href="../../css/styles.css"></head><body data-page="register"><div id="header"></div><main class="wrap page narrow"><p class="crumb"><a href="../../index.html">Inicio</a> / Registro</p><section class="panel"><p class="eyebrow">CUENTA DE CLIENTE</p><h1>Crear una cuenta</h1><form id="registerForm"><label>Nombre completo<input id="name" required minlength="3"></label><label>Correo electrónico<input id="email" type="email" required></label><label>Contraseña<input id="pass" type="password" required></label><small>Mínimo 8 caracteres, mayúscula, minúscula, número y carácter especial.</small><label>Confirmar contraseña<input id="confirm" type="password" required></label><label class="check"><input id="terms" type="checkbox"> <span>Acepto <button type="button" class="link" id="termsBtn">términos y condiciones</button></span></label><button class="btn primary full" type="submit">Registrarse</button><p id="message" role="status"></p><p class="center">¿Ya tienes cuenta? <button type="button" class="link" id="loginBtn">Iniciar sesión</button></p></form></section></main><div id="footer"></div><div id="modal"></div><script src="../../js/data.js"></script><script src="../../js/layout.js"></script><script src="../../js/app.js"></script></body></html>
